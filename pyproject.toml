[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "private-email-rag"
version = "0.1.0"
description = "Stage 1: a local, read-only Gmail RAG proof of concept"
requires-python = ">=3.11"
dependencies = [
  "google-api-python-client",
  "google-auth-httplib2",
  "google-auth-oauthlib",
  "numpy",
  "sentence-transformers",
]

[project.scripts]
email-rag = "email_rag.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

